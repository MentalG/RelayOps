services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: relayops-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5001/api
      INTERNAL_API_URL: http://api:5000/api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - relayops_node_modules:/app/node_modules
    command: bun --cwd apps/web dev --hostname 0.0.0.0 --port 3000

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: relayops-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://relayops:relayops_dev@postgres:5432/relayops?schema=public
      DATABASE_URL_HOST: postgresql://relayops:relayops_dev@postgres:5432/relayops?schema=public
      JWT_SECRET: dev-super-secret-change-in-production
      JWT_EXPIRES_IN: 7d
    ports:
      - "5001:5000"
    volumes:
      - .:/app
      - relayops_node_modules:/app/node_modules
    command: bun --cwd apps/api start:dev

  postgres:
    image: postgres:17-alpine
    container_name: relayops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: relayops
      POSTGRES_USER: relayops
      POSTGRES_PASSWORD: relayops_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayops -d relayops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  relayops_node_modules:
  postgres_data:
